
name: Build & Push Docker Image

# Trigger workflow on push to main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_YOUR }}
          password: ${{ secrets.DOCKER_PASSWORD_YOUR }}

      # 3️⃣ Build Docker image
      - name: Build Streamlit Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/contacts-app:latest ./app

      # 4️⃣ Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/contacts-app:latest
