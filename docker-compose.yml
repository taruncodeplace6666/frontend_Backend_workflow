version: '3.9'

services:
  db:
    image: postgres:15
    container_name: pgdb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  streamlit:
    build: ./app
    container_name: streamlit_app
    ports:
      - "8501:8501"
    environment:
      - PG_HOST=db
      - PG_PORT=5432
      - PG_DB=mydatabase
      - PG_USER=postgres
      - PG_PASSWORD=postgres
    depends_on:
      - db
    volumes:
      - ./app:/app

volumes:
  pgdata:
